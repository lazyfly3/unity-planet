<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 Z" fill="#1f334a"/>
    </marker>
    <radialGradient id="sphere" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#d8f1ff"/>
      <stop offset="0.55" stop-color="#78a9cb"/>
      <stop offset="1" stop-color="#2a5374"/>
    </radialGradient>
    <style>
      .bg { fill: #f6f9fc; }
      .title { font: 700 54px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #122033; }
      .subtitle { font: 400 27px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52657b; }
      .head { font: 700 31px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #122033; }
      .body { font: 400 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #2f4054; }
      .formula { font: 500 25px "Consolas", "Microsoft YaHei", monospace; fill: #0b4269; }
      .small { font: 500 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52657b; }
      .panel { fill: #ffffff; stroke: #d4dde8; stroke-width: 3; }
      .badPanel { fill: #fff3f3; stroke: #ee9b9b; stroke-width: 3; }
      .goodPanel { fill: #eefaf2; stroke: #82c99b; stroke-width: 3; }
      .line { stroke: rgba(255,255,255,0.68); stroke-width: 2.5; fill: none; }
      .equator { stroke: #ffd166; stroke-width: 7; fill: none; }
      .polar { stroke: #ef476f; stroke-width: 7; fill: none; }
      .point { fill: #163047; stroke: #ffffff; stroke-width: 3; }
      .redPoint { fill: #ef476f; stroke: #ffffff; stroke-width: 3; }
      .arrow { stroke: #1f334a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #788ca3; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .compress { fill: rgba(239,71,111,0.16); stroke: #ef476f; stroke-width: 4; }
      .tag { fill: #17334c; }
      .tagText { font: 500 25px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1080"/>
  <text class="title" x="80" y="92">为什么经纬度球体容易变形？</text>
  <text class="subtitle" x="82" y="135">等角度采样会让同样数量的点挤到越来越短的纬线上，极区网格被压缩</text>

  <rect class="panel" x="80" y="190" width="820" height="690" rx="22"/>
  <text class="head" x="125" y="250">同样数量的经度点，放在不同纬度</text>

  <circle cx="490" cy="535" r="255" fill="url(#sphere)"/>
  <ellipse class="line" cx="490" cy="535" rx="255" ry="52"/>
  <ellipse class="line" cx="490" cy="535" rx="210" ry="255" transform="rotate(30 490 535)"/>
  <ellipse class="line" cx="490" cy="535" rx="210" ry="255" transform="rotate(-30 490 535)"/>
  <ellipse class="line" cx="490" cy="535" rx="255" ry="170"/>
  <ellipse class="equator" cx="490" cy="535" rx="255" ry="52"/>
  <ellipse class="polar" cx="490" cy="380" rx="112" ry="24"/>

  <circle class="point" cx="235" cy="535" r="10"/>
  <circle class="point" cx="310" cy="503" r="10"/>
  <circle class="point" cx="490" cy="483" r="10"/>
  <circle class="point" cx="670" cy="503" r="10"/>
  <circle class="point" cx="745" cy="535" r="10"/>

  <circle class="redPoint" cx="378" cy="380" r="10"/>
  <circle class="redPoint" cx="430" cy="359" r="10"/>
  <circle class="redPoint" cx="490" cy="356" r="10"/>
  <circle class="redPoint" cx="550" cy="359" r="10"/>
  <circle class="redPoint" cx="602" cy="380" r="10"/>

  <text class="small" x="145" y="735">赤道：纬线长，同样点数分布较松</text>
  <text class="small" x="145" y="775">高纬度：纬线短，同样点数被挤在一起</text>
  <text class="formula" x="145" y="825">纬线周长 = 2πR × cos(纬度)</text>

  <path class="thin" d="M720 735 C760 650 780 555 745 535"/>
  <path class="thin" d="M725 775 C680 655 650 430 602 380"/>

  <rect class="badPanel" x="980" y="190" width="860" height="330" rx="22"/>
  <text class="head" x="1025" y="250">极区顶点汇聚</text>
  <text class="body" x="1025" y="300">越靠近两极，cos(纬度) 越接近 0，纬线周长越短。</text>
  <text class="body" x="1025" y="340">如果每条纬线仍放相同数量的点，点距会急剧变小。</text>
  <text class="formula" x="1025" y="392">纬度 → 90°，cos(纬度) → 0，周长 → 0</text>

  <g transform="translate(1120 430)">
    <path class="compress" d="M0 0 L260 0 L150 85 L110 85 Z"/>
    <path class="compress" d="M35 0 L225 0 L165 85 L95 85 Z"/>
    <path class="compress" d="M70 0 L190 0 L180 85 L80 85 Z"/>
  </g>
  <text class="small" x="1415" y="472">三角形被压缩</text>
  <text class="small" x="1415" y="510">面积不均匀</text>

  <rect class="goodPanel" x="980" y="600" width="860" height="280" rx="22"/>
  <text class="head" x="1025" y="660">带来的问题</text>
  <text class="body" x="1025" y="710">极区顶点密集，赤道相对稀疏</text>
  <text class="body" x="1025" y="750">地形噪声与贴图在极区容易被拉伸或压缩</text>
  <text class="body" x="1025" y="790">LOD 分块和碰撞网格不均匀，不利于星球级生成</text>

  <rect class="tag" x="80" y="925" width="1760" height="85" rx="18"/>
  <text class="tagText" x="125" y="978">结论：问题不在于球体本身，而在于经纬度球采用“等角度采样”；球面实际距离随纬度变化，所以越靠近极点越容易产生网格挤压。</text>
</svg>
