<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172f"/>
      <stop offset="0.55" stop-color="#17406b"/>
      <stop offset="1" stop-color="#0a203f"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d51"/>
      <stop offset="1" stop-color="#1a527d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffbd59"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 54px; font-weight: 700; fill: #ffffff; }
      .slide-title { font-size: 48px; font-weight: 700; fill: #ffffff; }
      .slide-subtitle { font-size: 32px; font-weight: 700; fill: #ffffff; }
      .body { font-size: 28px; font-weight: 400; fill: #f4f8ff; }
      .small { font-size: 20px; font-weight: 400; fill: #d7e6f5; }
      .label { font-size: 27px; font-weight: 700; fill: #10243b; }
      .label-body { font-size: 21px; font-weight: 400; fill: #314b65; }
      .ref-title { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .ref-text { font-size: 17px; font-weight: 400; fill: #e8f2ff; }
      .node { fill: #f8fbff; stroke: #b8c9da; stroke-width: 2; }
      .node-text { font-size: 21px; font-weight: 600; fill: #17324d; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1670" cy="170" r="250" fill="#80c7e8" opacity="0.08"/>
  <circle cx="280" cy="940" r="330" fill="#4c87cf" opacity="0.08"/>
  <path d="M0 690 C420 570, 690 820, 1080 650 S1600 520, 1920 630" fill="none" stroke="#a7d9ee" stroke-width="3" opacity="0.09"/>

  <text x="90" y="82" class="cn title">PPT 论文引用放置示例</text>
  <text x="91" y="122" class="cn small">正文使用编号，页脚给出短引用，最后一页列出完整参考文献</text>

  <!-- Main slide mockup -->
  <rect x="80" y="155" width="1260" height="835" rx="16" fill="url(#slide)" stroke="#8eb9dc" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1110" cy="315" r="260" fill="#d7eff9" opacity="0.07"/>
  <text x="130" y="230" class="cn slide-title">2. 课题研究展示</text>
  <text x="140" y="290" class="cn slide-subtitle">➤ 飞船操控物理框架</text>

  <!-- Flow -->
  <rect x="135" y="342" width="160" height="72" rx="8" class="node"/>
  <text x="215" y="386" text-anchor="middle" class="cn node-text">输入指令</text>
  <line x1="295" y1="378" x2="350" y2="378" stroke="#d6e5f2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="363" y="342" width="190" height="72" rx="8" class="node"/>
  <text x="458" y="386" text-anchor="middle" class="cn node-text">目标速度 / 姿态</text>
  <line x1="553" y1="378" x2="608" y2="378" stroke="#d6e5f2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="621" y="342" width="180" height="72" rx="8" class="node"/>
  <text x="711" y="386" text-anchor="middle" class="cn node-text">计算力与力矩</text>
  <line x1="801" y1="378" x2="856" y2="378" stroke="#d6e5f2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="869" y="342" width="170" height="72" rx="8" class="node"/>
  <text x="954" y="386" text-anchor="middle" class="cn node-text">推进器分配</text>
  <line x1="1039" y1="378" x2="1094" y2="378" stroke="#d6e5f2" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1107" y="342" width="170" height="72" rx="8" class="node"/>
  <text x="1192" y="386" text-anchor="middle" class="cn node-text">飞船运动</text>

  <!-- Body citation example -->
  <rect x="125" y="470" width="1170" height="290" rx="14" fill="#071a31" opacity="0.48" stroke="#79acd0" stroke-width="1"/>
  <text x="160" y="535" class="cn body">
    <tspan font-weight="700">推进器分配：</tspan>
    <tspan>根据目标力与目标力矩，求解各推进器的输出比例，</tspan>
  </text>
  <text x="160" y="583" class="cn body">
    <tspan>使实际控制量尽量接近期望值</tspan>
    <tspan fill="#ffbd59" font-weight="700"> [1-2]</tspan>
    <tspan>。</tspan>
  </text>
  <text x="160" y="648" class="cn body">
    <tspan font-weight="700">飞控结构：</tspan>
    <tspan>采用“姿态控制器—控制分配—推进器执行”的分层框架</tspan>
  </text>
  <text x="160" y="696" class="cn body">
    <tspan>并针对模块化飞船进行实时重建</tspan>
    <tspan fill="#ffbd59" font-weight="700"> [3]</tspan>
    <tspan>。</tspan>
  </text>

  <!-- Footer references -->
  <line x1="130" y1="824" x2="1290" y2="824" stroke="#9ec3df" stroke-width="1.5" opacity="0.75"/>
  <text x="140" y="866" class="cn small">
    <tspan fill="#ffbd59" font-weight="700">[1]</tspan>
    <tspan> Härkegård O., 2004.　</tspan>
    <tspan fill="#ffbd59" font-weight="700">[2]</tspan>
    <tspan> Bodson M., 2002.　</tspan>
    <tspan fill="#ffbd59" font-weight="700">[3]</tspan>
    <tspan> Bevacqua T. et al., 2004.</tspan>
  </text>
  <text x="140" y="916" class="cn small" fill="#a9c6dc">
    页脚只保留“作者 + 年份”，完整信息统一放在最后的参考文献页。
  </text>

  <!-- Callouts -->
  <rect x="1410" y="170" width="420" height="150" rx="18" fill="#fff7e6" stroke="#ffbd59" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="1454" cy="214" r="25" fill="#ffbd59"/>
  <text x="1454" y="223" text-anchor="middle" class="cn label">1</text>
  <text x="1492" y="216" class="cn label">正文引用编号</text>
  <text x="1450" y="262" class="cn label-body">放在使用该方法的句子或公式后，</text>
  <text x="1450" y="292" class="cn label-body">编号与末页参考文献保持一致。</text>
  <path d="M1410 255 C1360 270, 1345 480, 1232 572" fill="none" stroke="#ffbd59" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1410" y="360" width="420" height="150" rx="18" fill="#edf8ff" stroke="#68b9e8" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="1454" cy="404" r="25" fill="#68b9e8"/>
  <text x="1454" y="413" text-anchor="middle" class="cn label">2</text>
  <text x="1492" y="406" class="cn label">本页简化来源</text>
  <text x="1450" y="452" class="cn label-body">页面底部使用小号文字，写作者</text>
  <text x="1450" y="482" class="cn label-body">和年份即可，不要塞入完整条目。</text>
  <path d="M1410 446 C1360 500, 1370 810, 1268 853" fill="none" stroke="#68b9e8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Mini references slide -->
  <rect x="1410" y="555" width="420" height="420" rx="18" fill="#0d2c4c" stroke="#7da8cc" stroke-width="2" filter="url(#shadow)"/>
  <text x="1445" y="610" class="cn ref-title">3　末页：参考文献</text>
  <line x1="1445" y1="632" x2="1795" y2="632" stroke="#7da8cc" stroke-width="1"/>
  <text x="1445" y="674" class="cn ref-text">
    <tspan x="1445" dy="0">[1] HÄRKEGÅRD O. Dynamic control</tspan>
    <tspan x="1472" dy="25">allocation using constrained quadratic</tspan>
    <tspan x="1472" dy="25">programming[J]. JGCD, 2004.</tspan>
  </text>
  <text x="1445" y="770" class="cn ref-text">
    <tspan x="1445" dy="0">[2] BODSON M. Evaluation of optimization</tspan>
    <tspan x="1472" dy="25">methods for control allocation[J].</tspan>
    <tspan x="1472" dy="25">JGCD, 2002.</tspan>
  </text>
  <text x="1445" y="866" class="cn ref-text">
    <tspan x="1445" dy="0">[3] BEVACQUA T, et al. A flight control</tspan>
    <tspan x="1472" dy="25">approach for small reentry vehicles[C].</tspan>
    <tspan x="1472" dy="25">AIAA GNC, 2004.</tspan>
  </text>
  <rect x="1443" y="937" width="354" height="2" fill="#ffbd59" opacity="0.85"/>
</svg>
